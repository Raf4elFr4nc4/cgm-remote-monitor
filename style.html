<style>
  :root {
    --primary: #1565C0;
    --primary-2: #1976D2;
    --primary-light: #42A5F5;
    --primary-soft: #E3F2FD;
    --accent: #FFC107;
    --warning: #FF9800;
    --success: #4CAF50;
    --danger: #F44336;
    --surface: #FFFFFF;
    --surface-2: #F8FAFC;
    --border: #E5E7EB;
    --text: #263238;
    --muted: #607D8B;
    --shadow: 0 16px 38px rgba(21, 101, 192, .10);
    --radius-lg: 24px;
    --radius-md: 16px;
    --radius-sm: 12px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--surface-2);
    color: var(--text);
    font-family: 'Roboto', Arial, sans-serif;
  }

  .erp-layout { display: grid; grid-template-columns: 280px 1fr; min-height: 100vh; transition: grid-template-columns .24s ease; }
  .erp-layout.sidebar-collapsed { grid-template-columns: 88px 1fr; }
  .erp-layout.sidebar-collapsed .brand-copy, .erp-layout.sidebar-collapsed .nav-item span:last-child { display: none; }
  .erp-layout.sidebar-collapsed .sidebar { align-items: center; }
  .erp-layout.sidebar-collapsed .nav-item { justify-content: center; width: 52px; padding: 0; }
  .sidebar { position: sticky; top: 0; height: 100vh; padding: 22px 16px; background: linear-gradient(180deg, #0D47A1, var(--primary)); color: #fff; display: flex; flex-direction: column; gap: 24px; }
  .sidebar-brand { display: flex; align-items: center; gap: 14px; padding: 0 8px 18px; border-bottom: 1px solid rgba(255,255,255,.16); }
  .logo-mark { width: 52px; height: 52px; display: grid; place-items: center; border-radius: 18px; background: #fff; color: var(--primary); font-size: 19px; font-weight: 800; letter-spacing: .08em; box-shadow: 0 12px 26px rgba(0,0,0,.14); }
  .brand-copy { display: grid; gap: 2px; }
  .brand-copy span { color: rgba(255,255,255,.76); font-size: 13px; }
  .sidebar-nav { display: grid; gap: 6px; }
  .nav-item { position: relative; display: flex; align-items: center; gap: 12px; min-height: 46px; padding: 0 14px; border-radius: 14px; color: #fff; text-decoration: none; transition: background .22s ease, transform .22s ease; }
  .nav-item:hover { background: rgba(66,165,245,.25); transform: translateX(3px); }
  .nav-item.active { background: rgba(66,165,245,.34); font-weight: 700; }
  .nav-item.active::before { content: ''; position: absolute; left: -16px; width: 4px; height: 28px; border-radius: 0 8px 8px 0; background: var(--accent); }
  .sidebar-toggle { margin-top: auto; min-height: 44px; border: 1px solid rgba(255,255,255,.18); border-radius: 14px; background: rgba(255,255,255,.10); color: #fff; cursor: pointer; transition: background .2s ease; }
  .sidebar-toggle:hover { background: rgba(255,255,255,.18); }

  .workspace { min-width: 0; padding: 0 28px 32px; }
  .topbar { position: sticky; top: 0; z-index: 5; min-height: 78px; display: grid; grid-template-columns: auto minmax(220px, 540px) auto; align-items: center; gap: 22px; background: rgba(255,255,255,.94); border-bottom: 3px solid rgba(21,101,192,.14); backdrop-filter: blur(14px); }
  .topbar-logo, .topbar-actions, .user-chip, .global-search { display: flex; align-items: center; }
  .topbar-logo { gap: 10px; color: var(--primary); }
  .global-search { gap: 10px; min-height: 48px; padding: 0 16px; border: 1px solid var(--border); border-radius: 999px; background: var(--surface-2); color: var(--muted); }
  .global-search input { width: 100%; border: 0; outline: 0; background: transparent; color: var(--text); font-size: 15px; }
  .topbar-actions { justify-content: flex-end; gap: 14px; }
  .icon-button { position: relative; width: 44px; height: 44px; border: 1px solid var(--border); border-radius: 14px; background: #fff; color: var(--primary); cursor: pointer; }
  .icon-button em { position: absolute; top: -5px; right: -5px; width: 20px; height: 20px; display: grid; place-items: center; border-radius: 50%; background: var(--accent); color: var(--text); font-style: normal; font-size: 11px; font-weight: 800; }
  .user-chip { gap: 10px; padding: 7px 10px; border: 1px solid var(--border); border-radius: 999px; background: #fff; }
  .avatar { width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%; background: var(--primary-soft); color: var(--primary); font-weight: 800; }
  .user-chip span { display: block; color: var(--muted); font-size: 12px; }

  .dashboard-header, .search-panel, .chart-card, .info-card, .table-card, .message-card, .loading-card, .kpi-card, .summary-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow); }
  .dashboard-header { margin-top: 28px; padding: 28px; display: flex; justify-content: space-between; align-items: center; gap: 20px; }
  .eyebrow, .section-kicker { margin: 0 0 8px; color: var(--primary); font-weight: 800; letter-spacing: .14em; text-transform: uppercase; font-size: 12px; }
  h1, h2 { margin: 0; }
  h1 { font-size: clamp(28px, 3.8vw, 44px); line-height: 1.05; }
  .dashboard-header span { display: block; margin-top: 8px; color: var(--muted); }

  .kpi-grid { margin-top: 22px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .kpi-card { position: relative; overflow: hidden; min-height: 164px; padding: 20px; transition: transform .22s ease, box-shadow .22s ease; }
  .kpi-card:hover, .summary-card:hover { transform: translateY(-4px); box-shadow: 0 20px 46px rgba(21,101,192,.16); }
  .kpi-card > .material-symbols-rounded { position: absolute; right: 18px; top: 18px; color: var(--primary); background: var(--primary-soft); padding: 10px; border-radius: 14px; }
  .kpi-card span { color: var(--muted); font-weight: 700; }
  .kpi-card strong { display: block; margin: 10px 0 4px; font-size: 30px; color: var(--text); }
  .kpi-card.highlight strong { color: #B88700; }
  .kpi-card.warning strong { color: var(--warning); }
  .kpi-card small { color: var(--success); font-weight: 700; }
  .sparkline { position: absolute; left: 20px; right: 20px; bottom: 18px; height: 34px; opacity: .9; background: linear-gradient(135deg, transparent 18%, var(--primary-light) 19% 23%, transparent 24% 38%, var(--accent) 39% 43%, transparent 44% 62%, var(--primary) 63% 67%, transparent 68%); }
  .sparkline.success { background: linear-gradient(135deg, transparent 18%, var(--success) 19% 23%, transparent 24% 52%, var(--primary-light) 53% 57%, transparent 58%); }
  .sparkline.down { background: linear-gradient(45deg, transparent 18%, var(--warning) 19% 23%, transparent 24% 52%, var(--danger) 53% 57%, transparent 58%); }

  .chart-card { margin-top: 22px; padding: 24px; min-height: 310px; }
  .chart-card canvas { width: 100%; height: 230px; max-height: 260px; }
  .search-panel { margin-top: 22px; padding: 22px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .search-actions { display: flex; gap: 12px; flex-wrap: wrap; }
  .primary-button, .secondary-button { min-height: 48px; border-radius: 14px; padding: 0 20px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 800; cursor: pointer; transition: transform .2s ease, box-shadow .2s ease, background .2s ease; }
  .primary-button { border: 0; background: var(--primary); color: #fff; box-shadow: 0 12px 24px rgba(21,101,192,.22); }
  .secondary-button { border: 1px solid var(--primary); background: #fff; color: var(--primary); }
  .secondary-button.small { min-height: 38px; padding: 0 14px; }
  .primary-button:hover, .secondary-button:hover { transform: translateY(-2px); }
  .primary-button:disabled, .secondary-button:disabled { cursor: wait; opacity: .68; transform: none; }
  .primary-button.is-loading { background: var(--primary-2); }

  .hidden { display: none !important; }
  .message-card, .loading-card { margin-top: 18px; padding: 18px 22px; color: var(--muted); }
  .message-card.error { color: #B71C1C; border-color: rgba(244,67,54,.28); background: #FFEBEE; }
  .message-card.success { color: #1B5E20; border-color: rgba(76,175,80,.28); background: #E8F5E9; }
  .loading-card { display: flex; align-items: center; gap: 12px; }
  .skeleton-line { width: 160px; height: 14px; border-radius: 999px; background: linear-gradient(90deg, #edf2f7, #fff, #edf2f7); animation: shimmer 1.1s infinite; }
  .skeleton-line.short { width: 90px; }
  @keyframes shimmer { to { filter: brightness(.92); transform: translateX(4px); } }

  .result-area { margin-top: 22px; display: grid; gap: 22px; }
  .cards-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .summary-card { padding: 20px; transition: transform .22s ease, box-shadow .22s ease; }
  .summary-icon { width: 46px; height: 46px; border-radius: 16px; display: grid; place-items: center; margin-bottom: 16px; }
  .summary-title { margin: 0 0 8px; color: var(--muted); font-size: 14px; font-weight: 800; }
  .summary-value { margin: 0; font-size: 26px; font-weight: 800; color: var(--primary); }
  .blue { color: var(--primary); background: var(--primary-soft); }
  .green { color: #2E7D32; background: #E8F5E9; }
  .orange { color: #EF6C00; background: #FFF3E0; }
  .purple { color: #6f42c1; background: #f1e8ff; }
  .red { color: #C62828; background: #FFEBEE; }
  .details-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px; }
  .info-card, .table-card { padding: 24px; }
  .section-title { display: flex; align-items: center; gap: 10px; color: var(--primary); }
  .data-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-top: 18px; }
  .data-item { padding: 14px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-2); }
  .data-label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; font-weight: 800; text-transform: uppercase; }
  .data-value { font-size: 16px; font-weight: 500; word-break: break-word; }
  .table-toolbar { display: flex; justify-content: space-between; align-items: center; gap: 16px; margin-bottom: 18px; }
  .table-controls { display: flex; gap: 10px; }
  .table-controls input { min-height: 38px; border: 1px solid var(--border); border-radius: 999px; padding: 0 14px; outline: 0; }
  .table-wrapper { overflow: auto; border: 1px solid var(--border); border-radius: 18px; }
  .components-table { width: 100%; border-collapse: collapse; min-width: 860px; }
  .components-table th { position: sticky; top: 0; z-index: 1; background: #fff; color: var(--primary); text-align: left; padding: 14px; font-size: 13px; border-bottom: 2px solid var(--primary-light); resize: horizontal; overflow: auto; }
  .components-table td { padding: 14px; border-bottom: 1px solid var(--border); }
  .components-table tr:nth-child(even) td { background: var(--primary-soft); }
  .components-table tr:hover td { background: #eef7ff; }
  .status-pill { display: inline-flex; align-items: center; min-height: 28px; padding: 0 12px; border-radius: 999px; font-weight: 800; font-size: 12px; }
  .pagination { display: flex; justify-content: flex-end; align-items: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: 13px; }
  .pagination button { border: 1px solid var(--border); border-radius: 10px; background: #fff; color: var(--primary); padding: 8px 12px; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #c6d1e1; border-radius: 999px; }
  ::-webkit-scrollbar-track { background: #f1f5f9; }

  @media (max-width: 1180px) { .erp-layout { grid-template-columns: 88px 1fr; } .brand-copy, .nav-item span:last-child { display: none; } .sidebar { align-items: center; } .nav-item { justify-content: center; width: 52px; padding: 0; } .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (max-width: 860px) { .erp-layout { display: block; } .sidebar { position: relative; width: 100%; height: auto; flex-direction: row; overflow-x: auto; } .sidebar-brand, .sidebar-toggle { display: none; } .sidebar-nav { display: flex; } .workspace { padding: 0 16px 24px; } .topbar { grid-template-columns: 1fr; padding: 14px 0; } .topbar-actions { justify-content: space-between; } .dashboard-header, .search-panel, .table-toolbar { align-items: flex-start; flex-direction: column; } .kpi-grid, .cards-grid, .details-grid, .data-grid { grid-template-columns: 1fr; } }
</style>
